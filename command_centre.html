<title>Nikos · Command Centre</title>
<style>
  :root {
    --bg:        #F4F6FA;
    --surface:   #FFFFFF;
    --border:    #E3E8F0;
    --border-2:  #CFD7E3;
    --text-1:    #0A2340;
    --text-2:    #475569;
    --text-3:    #94A3B8;
    --primary:   #0A2340;
    --primary-2: #14315B;
    --pink:      #BE185D;
    --amber:     #B45309;
    --emerald:   #047857;
    --code-bg:   #0F172A;
    --shadow-1:  0 1px 2px rgba(10,35,64,0.04), 0 1px 3px rgba(10,35,64,0.05);
    --shadow-2:  0 4px 14px rgba(10,35,64,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text-1);
    min-height: 100vh;
    padding-bottom: 64px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  .wrap { max-width: 820px; margin: 0 auto; }

  /* ── Hero ── */
  .hero {
    background: var(--primary);
    color: white;
    padding: 30px 22px 26px;
    padding-top: calc(30px + env(safe-area-inset-top));
  }
  .hero-eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: 2px;
    text-transform: uppercase; opacity: 0.55; margin-bottom: 10px;
  }
  .hero-title { font-size: 26px; font-weight: 700; letter-spacing: -0.5px; line-height: 1.15; }
  .hero-date { font-size: 12px; font-weight: 500; opacity: 0.65; margin-top: 8px; }

  .hero.detail { padding-bottom: 22px; }
  .backlink {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.7);
    text-decoration: none; margin-bottom: 14px;
    -webkit-tap-highlight-color: transparent;
  }
  .backlink:active { color: white; }
  .hero-sub { font-size: 13px; opacity: 0.72; margin-top: 10px; line-height: 1.55; max-width: 60ch; }
  .hero-icon { font-size: 26px; margin-right: 8px; }

  /* ── Search ── */
  .searchbar { padding: 18px 18px 0; }
  .searchbar input {
    width: 100%; font-family: inherit; font-size: 15px;
    padding: 11px 14px; border-radius: 10px;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text-1); box-shadow: var(--shadow-1);
    -webkit-appearance: none;
  }
  .searchbar input::placeholder { color: var(--text-3); }
  .searchbar input:focus { outline: none; border-color: var(--border-2); }

  /* ── Section ── */
  .section { padding: 26px 18px 0; }
  .section-header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .section-label {
    font-size: 10.5px; font-weight: 700; color: var(--text-2);
    letter-spacing: 1.6px; text-transform: uppercase;
  }
  .section-rule { flex: 1; height: 1px; background: var(--border); }

  /* ── Grid ── */
  .grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
  @media (min-width: 720px) { .grid { grid-template-columns: repeat(3, 1fr); align-items: start; } }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
    box-shadow: var(--shadow-1);
    position: relative; overflow: hidden;
    text-decoration: none; color: inherit;
    transition: box-shadow 0.2s, border-color 0.2s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }
  .card:hover { border-color: var(--border-2); box-shadow: var(--shadow-2); }
  .card:active { transform: scale(0.995); }
  .card .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: transparent; }
  .card.acc-pink .accent { background: var(--pink); }
  .card.acc-amber .accent { background: var(--amber); }
  .card.acc-emerald .accent { background: var(--emerald); }

  .card-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
  .card-icon { font-size: 22px; line-height: 1; }
  .card-title { font-size: 16px; font-weight: 700; line-height: 1.3; letter-spacing: -0.2px; }
  .card-desc { font-size: 12px; color: var(--text-2); line-height: 1.55; }
  .card-foot {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 11px; font-weight: 600; color: var(--text-3); margin-top: 2px;
  }

  .status {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 9.5px; font-weight: 700; color: var(--emerald);
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .status::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--emerald); }
  .status.amber { color: var(--amber); } .status.amber::before { background: var(--amber); }
  .status.pink  { color: var(--pink);  } .status.pink::before  { background: var(--pink); }
  .status.slate { color: var(--text-3);} .status.slate::before { background: var(--text-3); }

  /* ── Buttons ── */
  .actions { display: flex; flex-direction: column; gap: 6px; margin-top: 2px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 12px; border-radius: 8px;
    font-family: inherit; font-size: 12.5px; font-weight: 600;
    color: var(--text-1); background: #FFFFFF;
    border: 1px solid var(--border);
    text-decoration: none; cursor: pointer; line-height: 1;
    transition: background 0.12s, border-color 0.12s, transform 0.1s;
    -webkit-tap-highlight-color: transparent; text-align: left;
  }
  .btn:hover { background: #F8FAFC; border-color: var(--border-2); }
  .btn:active { transform: scale(0.98); }
  .btn .ic { font-size: 12px; opacity: 0.85; }
  .btn .lbl { flex: 1; }
  .btn .ch { color: var(--text-3); font-size: 11px; font-weight: 600; }
  .btn.primary { background: var(--primary); color: white; border-color: var(--primary); }
  .btn.primary:hover { background: var(--primary-2); border-color: var(--primary-2); }
  .btn.primary .ch { color: rgba(255,255,255,0.55); }
  .btn.full { width: 100%; }

  /* ── Runbook ── */
  .panel {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px 16px;
    box-shadow: var(--shadow-1); margin-bottom: 14px;
  }
  .panel h3 {
    font-size: 10.5px; font-weight: 700; color: var(--text-2);
    letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 12px;
  }
  .panel p { font-size: 13.5px; line-height: 1.65; color: var(--text-2); }
  .panel p + p { margin-top: 10px; }
  .panel strong { color: var(--text-1); font-weight: 650; }
  ul.list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
  ul.list li {
    font-size: 13.5px; line-height: 1.6; color: var(--text-2);
    padding-left: 16px; position: relative;
  }
  ul.list li::before {
    content: ""; position: absolute; left: 3px; top: 9px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--border-2);
  }
  ol.steps { list-style: none; counter-reset: s; display: flex; flex-direction: column; gap: 11px; }
  ol.steps li {
    font-size: 13.5px; line-height: 1.6; color: var(--text-2);
    counter-increment: s; padding-left: 28px; position: relative;
  }
  ol.steps li::before {
    content: counter(s); position: absolute; left: 0; top: 1px;
    width: 19px; height: 19px; border-radius: 50%;
    background: var(--primary); color: white;
    font-size: 10.5px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  code {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 12px; background: #EEF2F8; color: var(--text-1);
    padding: 2px 5px; border-radius: 4px; word-break: break-word;
  }
  .cmd {
    display: flex; align-items: center; gap: 10px;
    background: var(--code-bg); border-radius: 8px;
    padding: 10px 12px; cursor: pointer; border: none; width: 100%;
    font-family: inherit; text-align: left;
    -webkit-tap-highlight-color: transparent;
  }
  .cmd:active { opacity: 0.85; }
  .cmd-body { flex: 1; min-width: 0; }
  .cmd-label, .cmd-text { display: block; }
  .cmd-label { font-size: 11px; font-weight: 700; color: rgba(255,255,255,0.55); letter-spacing: 0.4px; text-transform: uppercase; margin-bottom: 4px; }
  .cmd-text {
    font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
    font-size: 11.5px; color: #E2E8F0; line-height: 1.45; word-break: break-all;
  }
  .cmd-copy { font-size: 10.5px; font-weight: 700; color: rgba(255,255,255,0.45); letter-spacing: 0.5px; flex-shrink: 0; }
  .cmds { display: flex; flex-direction: column; gap: 8px; }

  .kv { display: flex; flex-direction: column; gap: 9px; }
  .kv-row { display: flex; gap: 12px; font-size: 12.5px; line-height: 1.55; }
  .kv-k { flex: 0 0 34%; color: var(--text-3); font-weight: 600; }
  .kv-v { flex: 1; color: var(--text-2); word-break: break-word; }

  .note {
    font-size: 12.5px; line-height: 1.6; color: var(--amber);
    background: #FFFBEB; border: 1px solid #FDE68A;
    border-radius: 9px; padding: 11px 13px;
  }

  .footer {
    text-align: center; font-size: 10.5px; color: var(--text-3);
    padding: 34px 18px 0; line-height: 1.7;
  }
  .footer strong { color: var(--text-2); font-weight: 600; }
  .empty { padding: 28px 4px; text-align: center; color: var(--text-3); font-size: 13px; }

  /* ── Freshness stamp ── */
  .stamp {
    display: flex; align-items: center; gap: 5px;
    font-size: 10.5px; font-weight: 600; letter-spacing: 0.2px;
    color: var(--text-3); margin-top: 2px;
  }
  .stamp::before {
    content: ""; width: 5px; height: 5px; border-radius: 50%;
    background: currentColor; opacity: 0.85; flex-shrink: 0;
  }
  .stamp.stale { color: var(--amber); }
  .hero .stamp { color: rgba(255,255,255,0.6); margin-top: 10px; }
  .hero .stamp.stale { color: #FCD34D; }
</style>
</head>

/* ══════════════════════════════════════════════════════════════
   RENDER
   ══════════════════════════════════════════════════════════════ */

var app = document.getElementById('app');

/* Declared here, not beside the freshness helpers below: those live after the
   first route() call, and a `var` initialiser down there is still undefined
   when the first render reads it. */
var MONTHS = { jan:0, feb:1, mar:2, apr:3, may:4, jun:5,
               jul:6, aug:7, sep:8, oct:9, nov:10, dec:11 };
var freshCache = {};

function esc(s) {
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function dateLine() {
  var opts = { weekday:'long', day:'numeric', month:'long', year:'numeric',
               hour:'2-digit', minute:'2-digit', timeZone:'Europe/Zurich' };
  return new Date().toLocaleDateString('en-GB', opts) + ' · Zurich';
}

function statusHtml(a) {
  if (!a.status) return '';
  var tone = a.status.tone ? ' ' + a.status.tone : '';
  return '<span class="status' + tone + '">' + esc(a.status.label) + '</span>';
}

function cardHtml(a) {
  return '' +
    '<a class="card' + (a.accent ? ' acc-' + a.accent : '') + '" href="#/' + a.id + '">' +
      '<span class="accent"></span>' +
      '<div class="card-row"><span class="card-icon">' + a.icon + '</span>' + statusHtml(a) + '</div>' +
      '<div class="card-title">' + esc(a.name) + '</div>' +
      '<div class="card-desc">' + esc(a.desc) + '</div>' +
      (a.fresh ? '<div class="stamp" data-fresh="' + a.id + '" style="display:none"></div>' : '') +
      '<div class="card-foot"><span>How to use</span><span>›</span></div>' +
    '</a>';
}

function renderHome(filter) {
  var q = (filter || '').trim().toLowerCase();
  var html = '' +
    '<header class="hero"><div class="wrap">' +
      '<div class="hero-eyebrow">Command Centre</div>' +
      '<div class="hero-title">Nikos Christou</div>' +
      '<div class="hero-date">' + dateLine() + '</div>' +
    '</div></header>' +
    '<div class="wrap">' +
      '<div class="searchbar"><input id="q" type="search" autocomplete="off" ' +
        'placeholder="Search apps…" value="' + esc(q) + '"></div>';

  var shown = 0;
  GROUPS.forEach(function (g) {
    var items = APPS.filter(function (a) {
      if (a.group !== g) return false;
      if (!q) return true;
      return (a.name + ' ' + a.desc + ' ' + a.group).toLowerCase().indexOf(q) > -1;
    });
    if (!items.length) return;
    shown += items.length;
    html += '<section class="section">' +
      '<div class="section-header"><span class="section-label">' + esc(g) + '</span>' +
      '<span class="section-rule"></span></div><div class="grid">' +
      items.map(cardHtml).join('') + '</div></section>';
  });

  if (!shown) html += '<div class="section"><div class="empty">Nothing matches “' + esc(q) + '”.</div></div>';

  html += '<div class="footer">Nikos Christou · <strong>nchristou@me.com</strong> · Zurich<br>' +
          'iPhone — Safari → Share → Add to Home Screen</div></div>';

  app.innerHTML = html;
  applyFreshness();

  var input = document.getElementById('q');
  input.addEventListener('input', function () {
    var v = this.value, pos = this.selectionStart;
    renderHome(v);
    var n = document.getElementById('q');
    n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {}
  });
}

function panel(title, inner) {
  return '<div class="panel"><h3>' + title + '</h3>' + inner + '</div>';
}

function renderDetail(a) {
  var html = '' +
    '<header class="hero detail"><div class="wrap">' +
      '<a class="backlink" href="#/">‹ All apps</a>' +
      '<div class="hero-title"><span class="hero-icon">' + a.icon + '</span>' + esc(a.name) + '</div>' +
      '<div class="hero-sub">' + esc(a.desc) + '</div>' +
      (a.fresh ? '<div class="stamp" data-fresh="' + a.id + '" style="display:none"></div>' : '') +
    '</div></header><div class="wrap"><div class="section">';

  if (a.links && a.links.length) {
    html += '<div class="panel"><h3>Open</h3><div class="actions">' +
      a.links.map(function (l) {
        return '<a class="btn full' + (l.primary ? ' primary' : '') + '" href="' + l.href +
               '" target="_blank" rel="noopener noreferrer">' +
               '<span class="ic">' + (l.primary ? '→' : '⌘') + '</span>' +
               '<span class="lbl">' + esc(l.label) + '</span><span class="ch">›</span></a>';
      }).join('') + '</div></div>';
  }

  if (a.bridge) {
    html += '<div class="panel" id="bridge-panel" style="display:none"><h3>Run it</h3>' +
      '<div class="actions">' +
        '<button class="btn primary full" id="ai-run"><span class="ic">▶</span>' +
        '<span class="lbl">Run Screener</span><span class="ch" id="ai-run-ch">›</span></button>' +
        '<a class="btn full" id="ai-local" href="http://127.0.0.1:8765/ai/screener" target="_blank" ' +
        'rel="noopener noreferrer" style="display:none"><span class="ic">⌘</span>' +
        '<span class="lbl">Local copy (fresh)</span><span class="ch">›</span></a>' +
      '</div>' +
      '<p id="ai-status" style="margin-top:10px;font-size:12px;color:var(--text-3)"></p></div>';
  }

  if (a.what) html += panel('What it is', '<p>' + a.what + '</p>');

  if (a.steps && a.steps.length) {
    html += panel('How to use it', '<ol class="steps">' +
      a.steps.map(function (s) { return '<li>' + s + '</li>'; }).join('') + '</ol>');
  }

  if (a.cmds && a.cmds.length) {
    html += panel('Commands', '<div class="cmds">' +
      a.cmds.map(function (c) {
        return '<button class="cmd" data-cmd="' + esc(c.cmd) + '">' +
          '<span class="cmd-body"><span class="cmd-label">' + esc(c.label) + '</span>' +
          '<span class="cmd-text">' + esc(c.cmd) + '</span></span>' +
          '<span class="cmd-copy">COPY</span></button>';
      }).join('') + '</div>');
  }

  if (a.where && a.where.length) {
    html += panel('Where things live', '<div class="kv">' +
      a.where.map(function (r) {
        return '<div class="kv-row"><div class="kv-k">' + esc(r[0]) + '</div>' +
               '<div class="kv-v">' + r[1] + '</div></div>';
      }).join('') + '</div>');
  }

  if (a.breaks && a.breaks.length) {
    html += panel('When it breaks', '<ul class="list">' +
      a.breaks.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>');
  }

  if (a.rules && a.rules.length) {
    html += panel('Rules &amp; gotchas', '<ul class="list">' +
      a.rules.map(function (b) { return '<li>' + b + '</li>'; }).join('') + '</ul>');
  }

  html += '</div><div class="footer">Command Centre · Nikos Christou</div></div>';
  app.innerHTML = html;

  Array.prototype.forEach.call(document.querySelectorAll('.cmd'), function (btn) {
    btn.addEventListener('click', function () { copyCmd(btn.getAttribute('data-cmd'), btn); });
  });

  if (a.bridge) initBridge();
  applyFreshness();
  window.scrollTo(0, 0);
}

function route() {
  var id = (location.hash || '').replace(/^#\/?/, '');
  if (!id) { renderHome(''); return; }
  var a = APPS.filter(function (x) { return x.id === id; })[0];
  if (a) renderDetail(a); else renderHome('');
}

window.addEventListener('hashchange', route);
route();
setInterval(function () {
  var el = document.querySelector('.hero-date');
  if (el) el.textContent = dateLine();
}, 30000);

/* ── copy ── */
function copyCmd(cmd, btn) {
  var tag = btn.querySelector('.cmd-copy');
  function done() {
    if (!tag) return;
    tag.textContent = '✓ COPIED'; tag.style.color = '#6EE7B7';
    setTimeout(function () { tag.textContent = 'COPY'; tag.style.color = ''; }, 2000);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(cmd).then(done).catch(fallback);
  } else fallback();
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = cmd; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch (e) {}
    document.body.removeChild(ta); done();
  }
}

/* ── SNIPER bridge (AI Universe card) ── */
var AI_BRIDGE = 'http://127.0.0.1:8765';
var aiPoll = null;

function aiSay(msg) {
  var el = document.getElementById('ai-status');
  if (el) el.innerHTML = msg;
}

function aiFallback() {
  /* No bridge — this is the normal case on the phone. Say nothing and leave the
     panel hidden; the copy-the-command list below is the path on that device. */
  var p = document.getElementById('bridge-panel');
  if (p) p.style.display = 'none';
  aiSay('');
}

function aiStatus(quiet) {
  return fetch(AI_BRIDGE + '/ai/status')
    .then(function (r) { return r.json(); })
    .then(function (j) {
      var p = document.getElementById('bridge-panel');
      if (p) p.style.display = '';
      var local = document.getElementById('ai-local');
      if (local) local.style.display = '';
      if (!quiet) {
        if (j.built) {
          var d = new Date(j.built);
          aiSay('Bridge live · last built ' + d.toLocaleString('en-GB',
            { day:'numeric', month:'short', hour:'2-digit', minute:'2-digit' }));
        } else {
          aiSay('Bridge live · nothing built yet — hit Run.');
        }
      }
      return j;
    })
    .catch(function () { aiFallback(); return null; });
}

function aiRun() {
  var b = document.getElementById('ai-run');
  aiSay('Starting…');
  fetch(AI_BRIDGE + '/ai', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}'
  })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.ok) { aiSay('✗ ' + (j.error || 'bridge refused')); return; }
      b.disabled = true; b.style.opacity = 0.55;
      document.getElementById('ai-run-ch').textContent = 'running';
      var t0 = Date.now();
      aiSay('Building — 128 tickers with market caps, ~3–5 min.');
      if (aiPoll) clearInterval(aiPoll);
      aiPoll = setInterval(function () {
        aiStatus(true).then(function (st) {
          if (!st) return;
          var run = st.last_run || {};
          if (run.status === 'done' || run.status === 'failed') {
            clearInterval(aiPoll); aiPoll = null;
            b.disabled = false; b.style.opacity = 1;
            document.getElementById('ai-run-ch').textContent = '›';
            var secs = Math.round((Date.now() - t0) / 1000);
            if (run.status !== 'done') {
              aiSay('✗ Run failed (exit ' + run.returncode + ') — see ~/Library/Logs/sniper_bridge/');
            } else if (run.published === false) {
              aiSay('✓ Built in ' + secs + 's, but the publish failed — local copy is current.');
            } else {
              aiSay('✓ Built in ' + secs + 's and published — live on the phone in ~2 min.');
            }
          }
        });
      }, 5000);
    })
    .catch(aiFallback);
}

/* ── Freshness stamps ───────────────────────────────────────────
   Each `fresh` app names a sibling file that some other system publishes.
   Read its own header timestamp rather than trusting a hand-set pill.
   ────────────────────────────────────────────────────────────── */
function parseStamp(txt) {
  /* "Monday, 07 September 2026 · 16:45"  and  "28 Aug 2026, 20:31" */
  var m = txt.match(/(\d{1,2})\s+([A-Za-z]{3,9})\s+(\d{4})[^\d]{0,4}(\d{1,2}):(\d{2})/);
  if (m && MONTHS[m[2].slice(0, 3).toLowerCase()] !== undefined) {
    return { d: new Date(+m[3], MONTHS[m[2].slice(0, 3).toLowerCase()],
                         +m[1], +m[4], +m[5]), time: true };
  }
  m = txt.match(/(\d{4})-(\d{2})-(\d{2})/);            /* "…· 2026-09-07" */
  if (m) return { d: new Date(+m[1], +m[2] - 1, +m[3]), time: false };
  return null;
}

function ago(d) {
  var h = (Date.now() - d.getTime()) / 3600000;
  if (h < 1)  return 'just now';
  if (h < 24) return Math.round(h) + 'h ago';
  var days = Math.round(h / 24);
  return days + (days === 1 ? ' day ago' : ' days ago');
}

function stampText(a, p) {
  var when = p.d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  if (p.time) {
    when += ' ' + p.d.toLocaleTimeString('en-GB',
      { hour: '2-digit', minute: '2-digit' });
  }
  return a.fresh.label + ' · ' + when + ' · ' + ago(p.d);
}

function paintStamp(el, a, p) {
  var stale = (Date.now() - p.d.getTime()) / 3600000 > a.fresh.staleHours;
  el.className = 'stamp' + (stale ? ' stale' : '');
  el.textContent = stampText(a, p);
  el.style.display = '';
}

function applyFreshness() {
  Array.prototype.forEach.call(document.querySelectorAll('[data-fresh]'), function (el) {
    var id = el.getAttribute('data-fresh');
    var a = APPS.filter(function (x) { return x.id === id; })[0];
    if (!a || !a.fresh) return;

    var hit = freshCache[a.fresh.src];
    if (hit) { paintStamp(el, a, hit); return; }

    /* Only the header is needed — ask for the first 32 KB, not the whole file.
       The screener's stamp sits at ~9 KB, behind its inline CSS, so 8 KB is too tight. */
    fetch(a.fresh.src, { headers: { Range: 'bytes=0-32767' }, cache: 'no-cache' })
      .then(function (r) { return r.text(); })
      .then(function (t) {
        var p = parseStamp(t);
        if (!p) return;
        freshCache[a.fresh.src] = p;
        paintStamp(el, a, p);
      })
      .catch(function () { /* offline, or opened as a local file — say nothing */ });
  });
}

function initBridge() {
  var b = document.getElementById('ai-run');
  if (b) b.addEventListener('click', aiRun);
  aiStatus(false);
}
</script>
