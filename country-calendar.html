<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 My Calendar</title>
<style>
:root{--bg:#0f1117;--card:#1c1f2e;--card2:#252940;--border:#2a2d3e;--text:#e8eaf6;--muted:#9aa8cc;--weekend:#5c6bc0;--today:#4f8cff;}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:14px;}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;flex-wrap:wrap;gap:8px;}
.hdr-l{display:flex;align-items:center;gap:10px;}
.title{font-size:1.05rem;font-weight:700;}
.sync-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:4px 9px;border-radius:6px;font-size:.68rem;white-space:nowrap;}
.sync-btn:hover{background:var(--card2);color:var(--text);}
.sync-ts{font-size:.58rem;color:var(--muted);}
.hdr-r{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.nav-row{display:flex;align-items:center;gap:5px;}
.nb{background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;width:26px;height:26px;border-radius:6px;font-size:.9rem;display:flex;align-items:center;justify-content:center;}
.nb:hover{background:var(--card2);}
.nlbl{font-size:.95rem;font-weight:700;min-width:170px;text-align:center;}
.vbtns{display:flex;background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.vb{background:none;border:none;border-right:1px solid var(--border);color:var(--muted);cursor:pointer;padding:5px 11px;font-size:.72rem;font-weight:600;}
.vb:last-child{border-right:none;}
.vb.active{background:var(--card2);color:var(--text);}

/* FILTER BAR */
.fbar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;}
.ftag{font-size:.65rem;padding:3px 9px;border-radius:20px;background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;user-select:none;}
.ftag.on{background:rgba(255,255,255,.11);color:var(--text);border-color:rgba(255,255,255,.2);}
.ftag:hover{background:var(--card2);}

/* YEAR VIEW */
.ygrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:10px;}
.mc-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;}
.mc-title{font-size:.7rem;font-weight:700;text-align:center;margin-bottom:4px;text-transform:uppercase;letter-spacing:.4px;cursor:pointer;color:var(--text);}
.mc-title:hover{color:var(--muted);}
.mc-hdr{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
.mc-hdr span{text-align:center;font-size:.52rem;color:var(--muted);font-weight:600;}
.mc-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
.mc{text-align:center;font-size:.62rem;padding:3px 1px;border-radius:3px;cursor:pointer;min-height:19px;position:relative;}
.mc:hover{background:rgba(255,255,255,.1);}
.mc.wknd{color:var(--weekend);}
.mc.today{outline:2px solid var(--today);outline-offset:-2px;font-weight:700;border-radius:50%;}

/* MONTH VIEW */
.mv-wrap{display:grid;grid-template-columns:1fr 210px;gap:12px;}
@media(max-width:680px){.mv-wrap{grid-template-columns:1fr;}}
.big-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.big-hdr{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card2);}
.big-hdr span{text-align:center;padding:5px 2px;font-size:.65rem;font-weight:600;color:var(--muted);}
.big-grid{display:grid;grid-template-columns:repeat(7,1fr);}
.bd{min-height:90px;padding:3px 4px;border-top:1px solid var(--border);border-right:1px solid var(--border);overflow:hidden;cursor:pointer;}
.bd:hover{background:rgba(255,255,255,.025);}
.bd.empty{background:rgba(0,0,0,.15);cursor:default;}
.dn{font-size:.72rem;font-weight:600;display:inline-flex;align-items:center;gap:2px;cursor:pointer;border-radius:3px;padding:0 2px;margin-bottom:1px;position:relative;z-index:1;}
.dn:hover{background:rgba(255,255,255,.18);}
.dn-hint{font-size:.42rem;opacity:.7;}
.bd.today .dn{background:var(--today);color:#fff;width:19px;height:19px;border-radius:50%;justify-content:center;font-size:.66rem;}
.bd.wknd .dn{color:var(--weekend);}
.bd.today.wknd .dn{color:#fff;}
.etags{display:flex;flex-direction:column;gap:1px;margin-top:1px;}
.etag{font-size:.56rem;font-weight:500;padding:1px 3px;border-radius:2px;color:rgba(232,234,246,.82);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.4;display:block;background:rgba(255,255,255,.09);}
.etag.rec{background:rgba(255,255,255,.04);color:rgba(232,234,246,.45);font-style:italic;}
/* SIDEBAR */
.sidebar{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:10px;height:fit-content;max-height:82vh;overflow-y:auto;}
.sb-ttl{font-size:.62rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px;}
.hr{display:flex;align-items:flex-start;gap:6px;padding:3px 0;border-bottom:1px solid var(--border);font-size:.68rem;}
.hr:last-child{border-bottom:none;}
.hd{color:var(--muted);min-width:34px;font-size:.63rem;}

/* WEEK VIEW */
.wk-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.wk-hdr{display:grid;grid-template-columns:46px repeat(7,1fr);border-bottom:2px solid var(--border);}
.wk-corner{border-right:1px solid var(--border);}
.wk-hc{padding:6px 3px;text-align:center;border-right:1px solid var(--border);cursor:pointer;}
.wk-hc:last-child{border-right:none;}
.wk-hc:hover{background:rgba(255,255,255,.04);}
.wk-dow{font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;}
.wk-date{font-size:.85rem;font-weight:700;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:2px auto;}
.wk-date.today{background:var(--today);color:#fff;}
.wk-ad{display:grid;grid-template-columns:46px repeat(7,1fr);border-bottom:1px solid var(--border);}
.wk-ad-lbl{font-size:.52rem;color:var(--muted);display:flex;align-items:center;justify-content:center;border-right:1px solid var(--border);padding:3px;}
.wk-ad-col{border-right:1px solid var(--border);padding:2px;min-height:6px;}
.wk-ad-col:last-child{border-right:none;}
.wk-ae{font-size:.55rem;padding:1px 3px;background:rgba(255,255,255,.1);border-radius:2px;margin-bottom:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
.wk-body{display:grid;grid-template-columns:46px repeat(7,1fr);overflow-y:auto;max-height:540px;}
.wk-tc{border-right:1px solid var(--border);}
.wk-ts{height:50px;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:flex-start;padding:2px 3px;font-size:.55rem;color:var(--muted);}
.wk-dc{border-right:1px solid var(--border);position:relative;}
.wk-dc:last-child{border-right:none;}
.wk-hl{position:absolute;left:0;right:0;border-top:1px solid rgba(255,255,255,.05);pointer-events:none;}
.wk-ev{position:absolute;left:2px;right:2px;border-radius:3px;padding:2px 3px;background:rgba(255,255,255,.1);font-size:.55rem;overflow:hidden;border-left:2px solid rgba(255,255,255,.28);line-height:1.3;cursor:default;white-space:nowrap;text-overflow:ellipsis;}
.wk-ev:hover{background:rgba(255,255,255,.16);}

/* DAY VIEW */
.dv-wrap{max-width:560px;}
.dv-hdr{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:13px 16px;margin-bottom:9px;display:flex;align-items:center;justify-content:space-between;}
.dv-title{font-size:1.05rem;font-weight:700;}
.dv-sub{font-size:.7rem;color:var(--muted);margin-top:2px;}
.dv-cbtn{background:var(--card2);border:1px solid var(--border);color:var(--text);cursor:pointer;padding:5px 10px;border-radius:6px;font-size:.68rem;}
.dv-evts{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
.dv-sec{padding:6px 13px 3px;font-size:.58rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border-bottom:1px solid var(--border);}
.dv-row{display:flex;align-items:flex-start;gap:10px;padding:8px 13px;border-bottom:1px solid var(--border);font-size:.76rem;}
.dv-row:last-child{border-bottom:none;}
.dv-time{min-width:46px;color:var(--muted);font-size:.68rem;font-weight:600;flex-shrink:0;padding-top:1px;}
.dv-row.rec{opacity:.6;}
.no-ev{padding:14px 13px;color:var(--muted);font-size:.75rem;}

/* DCP POPUP */
.dcp-ov{position:fixed;inset:0;z-index:498;background:rgba(0,0,0,.35);display:none;}
.dcp-pop{position:fixed;z-index:499;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:210px;box-shadow:0 10px 40px rgba(0,0,0,.6);display:none;}
.dcp-ttl{font-size:.76rem;font-weight:700;margin-bottom:11px;}
.dcp-row{display:flex;align-items:center;gap:10px;margin-bottom:11px;}
.dcp-row label{font-size:.68rem;color:var(--muted);}
#dcp-picker{width:44px;height:30px;border:1px solid var(--border);border-radius:5px;cursor:pointer;background:none;padding:2px;}
.dcp-prev{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);display:inline-block;flex-shrink:0;}
.dcp-btns{display:flex;gap:6px;}
.dcp-btns button{background:var(--card2);border:1px solid var(--border);color:var(--text);cursor:pointer;padding:5px 11px;border-radius:6px;font-size:.68rem;}
.dcp-apply{background:#1e3a5f!important;border-color:#2563eb!important;color:#93c5fd!important;}
.dcp-clear{color:#f87171!important;}

/* TOAST */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e3a5f;border:1px solid #2563eb;color:#93c5fd;padding:8px 18px;border-radius:8px;font-size:.72rem;z-index:600;opacity:0;transition:opacity .3s;pointer-events:none;}
.toast.show{opacity:1;}
</style>
</head>
<body>
<div id="app"></div>
<div class="dcp-ov" id="dcp-ov" onclick="closeDcp()"></div>
<div class="dcp-pop" id="dcp-pop">
  <div class="dcp-ttl">🎨 Color — <span id="dcp-lbl" style="font-weight:400;opacity:.8;"></span></div>
  <div class="dcp-row">
    <label>Pick:</label>
    <input type="color" id="dcp-picker" value="#3949ab" oninput="document.getElementById('dcp-prev-el').style.background=this.value">
    <span class="dcp-prev" id="dcp-prev-el" style="background:#3949ab;"></span>
  </div>
  <div class="dcp-btns">
    <button class="dcp-apply" onclick="applyDcp()">✓ Apply</button>
    <button class="dcp-clear" onclick="clearDcp()">✕ Clear</button>
    <button onclick="closeDcp()">Cancel</button>
  </div>
</div>
<div class="toast" id="toast"></div>

// ── CONSTANTS ─────────────────────────────────
const MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_S=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS_S=["Mo","Tu","We","Th","Fr","Sa","Su"];
const DAYS_F=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

// ── STATE ──────────────────────────────────────
const today=new Date();
function getMon(d){const r=new Date(d);r.setDate(r.getDate()-((r.getDay()+6)%7));r.setHours(0,0,0,0);return r;}
let state={view:'yearly',year:today.getFullYear(),month:today.getMonth(),weekMon:getMon(today),dayDate:new Date(today)};
let customDays={};
try{const cd=localStorage.getItem('cal_cd');if(cd)customDays=JSON.parse(cd);}catch(e){}
let dcpKey=null;
function saveCD(){try{localStorage.setItem('cal_cd',JSON.stringify(customDays));}catch(e){}}

// ── HELPERS ────────────────────────────────────
function fd(y,m){return(new Date(y,m,1).getDay()+6)%7;}
function di(y,m){return new Date(y,m+1,0).getDate();}
function dow(y,m,d){return(new Date(y,m,d).getDay()+6)%7;}
function isT(y,m,d){return y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();}
function dk(y,m,d){return y+'-'+m+'-'+d;}
function addD(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d;}
function ft(h,m){return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');}
function contrast(hex){if(!hex)return'#fff';const c=hex.startsWith('#')?hex.slice(1):hex;const r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);return(0.299*r+0.587*g+0.114*b)>128?'#111':'#fff';}
function catOn(cat){for(const[k,f]of Object.entries(FILTERS)){if(k==='recurring')continue;if(f.cats.includes(cat))return f.on;}return true;}

function getEvts(y,m0,d){
  const res=[];
  for(const[cat,ydata]of Object.entries(H)){
    if(!catOn(cat))continue;
    for(const[em,ed,name]of(ydata[y]||[])){
      if(em===m0&&ed===d)res.push({rec:false,cat,label:name});
    }
  }
  if(FILTERS.recurring.on){
    const dw=(new Date(y,m0,d).getDay()+6)%7;
    for(const r of RECURRING){
      if(r.dow===dw)res.push({rec:true,label:r.label,h:r.h,m:r.m,dur:r.dur});
    }
    res.sort((a,b)=>{
      if(a.rec!==b.rec)return a.rec?1:-1;
      if(a.rec&&b.rec)return(a.h*60+a.m)-(b.h*60+b.m);
      return 0;
    });
  }
  return res;
}

// ── YEAR VIEW ─────────────────────────────────
function renderYear(){
  let h='<div class="ygrid">';
  for(let m=0;m<12;m++)h+=renderMini(state.year,m);
  return h+'</div>';
}
function renderMini(y,m){
  const f=fd(y,m),days=di(y,m);
  let cells='';
  for(let i=0;i<f;i++)cells+='<div class="mc"></div>';
  for(let d=1;d<=days;d++){
    const key=dk(y,m,d);
    const dw=(f+d-1)%7;
    const cc=customDays[key];
    const st=cc?` style="background:${cc};color:${contrast(cc)}"`:''
    cells+=`<div class="mc ${dw>=5&&!cc?'wknd':''} ${isT(y,m,d)?'today':''}"${st} onclick="openDcp(event,'${key}','${MONTHS_S[m]} ${d}')">${d}</div>`;
  }
  return `<div class="mc-card">
    <div class="mc-title" onclick="goMonth(${y},${m})">${MONTHS[m]}</div>
    <div class="mc-hdr">${DAYS_S.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="mc-grid">${cells}</div>
  </div>`;
}

// ── MONTH VIEW ────────────────────────────────
function renderMonth(){
  const{year:y,month:m}=state;
  const f=fd(y,m),days=di(y,m);
  let cells='';
  for(let i=0;i<f;i++)cells+='<div class="bd empty"></div>';
  for(let d=1;d<=days;d++){
    const key=dk(y,m,d);
    const dw=(f+d-1)%7;
    const cc=customDays[key];
    const bg=cc?` style="background:${cc}"`:''
    const dnSt=cc?`style="color:${contrast(cc)}"`:''
    const hint=cc?'<span class="dn-hint">●</span>':'';
    const evts=getEvts(y,m,d);
    const tags=evts.map(e=>`<span class="etag${e.rec?' rec':''}" title="${e.label}">${e.label}</span>`).join('');
    cells+=`<div class="bd ${isT(y,m,d)?'today':''} ${dw>=5?'wknd':''}"${bg} onclick="goDay(${y},${m},${d})">
      <span class="dn" ${dnSt} onclick="event.stopPropagation();openDcp(event,'${key}','${MONTHS_S[m]} ${d}')">${d}${hint}</span>
      ${tags?`<div class="etags">${tags}</div>`:''}
    </div>`;
  }
  const allEvts=[];
  for(let d=1;d<=days;d++)for(const e of getEvts(y,m,d))allEvts.push({d,label:e.label,rec:e.rec});
  const sbRows=allEvts.length
    ?allEvts.map(e=>`<div class="hr"><span class="hd">${MONTHS_S[m]} ${e.d}</span><span style="opacity:${e.rec?.5:1}">${e.label}</span></div>`).join('')
    :'<div style="padding:5px;color:var(--muted);font-size:.7rem;">No events</div>';
  return `<div class="mv-wrap">
    <div>
      <div class="nav-row" style="justify-content:center;margin-bottom:10px;">
        <button class="nb" onclick="prevM()">‹</button>
        <span class="nlbl">${MONTHS[m]} ${y}</span>
        <button class="nb" onclick="nextM()">›</button>
      </div>
      <div class="big-card">
        <div class="big-hdr">${DAYS_S.map(d=>`<span>${d}</span>`).join('')}</div>
        <div class="big-grid">${cells}</div>
      </div>
    </div>
    <div class="sidebar"><div class="sb-ttl">📅 ${MONTHS[m]} ${y}</div>${sbRows}</div>
  </div>`;
}

// ── WEEK VIEW ─────────────────────────────────
const WK_H0=8,WK_H1=21,WK_PH=50;
function renderWeek(){
  const mon=state.weekMon;
  const days=Array.from({length:7},(_,i)=>addD(mon,i));
  // header
  let hdr='<div class="wk-corner"></div>';
  for(const dd of days){
    const dw=(dd.getDay()+6)%7;
    const key=dk(dd.getFullYear(),dd.getMonth(),dd.getDate());
    const cc=customDays[key];
    const st=cc?` style="background:${cc};color:${contrast(cc)}"`:''
    const isTd=isT(dd.getFullYear(),dd.getMonth(),dd.getDate());
    hdr+=`<div class="wk-hc" onclick="goDay(${dd.getFullYear()},${dd.getMonth()},${dd.getDate()})"${st}>
      <div class="wk-dow">${DAYS_S[dw]}</div>
      <div class="wk-date${isTd?' today':''}">${dd.getDate()}</div>
    </div>`;
  }
  // all-day row
  let ad='<div class="wk-ad-lbl">all-day</div>';
  for(const dd of days){
    const evts=getEvts(dd.getFullYear(),dd.getMonth(),dd.getDate()).filter(e=>!e.rec);
    ad+=`<div class="wk-ad-col">${evts.map(e=>`<span class="wk-ae" title="${e.label}">${e.label}</span>`).join('')}</div>`;
  }
  // time grid
  const totalH=WK_H1-WK_H0;
  const colH=totalH*WK_PH;
  let tc='<div class="wk-tc">';
  for(let h=WK_H0;h<=WK_H1;h++)tc+=`<div class="wk-ts">${h}:00</div>`;
  tc+='</div>';
  let dcs='';
  for(const dd of days){
    const evts=getEvts(dd.getFullYear(),dd.getMonth(),dd.getDate()).filter(e=>e.rec);
    let lines='';
    for(let h=0;h<=totalH;h++)lines+=`<div class="wk-hl" style="top:${h*WK_PH}px"></div>`;
    let blocks='';
    for(const e of evts){
      const top=((e.h-WK_H0)*60+e.m)*(WK_PH/60);
      const ht=Math.max(e.dur*(WK_PH/60),16);
      if(top<0||top>colH)continue;
      blocks+=`<div class="wk-ev" style="top:${top.toFixed(1)}px;height:${ht.toFixed(1)}px" title="${e.label}">${e.label}</div>`;
    }
    dcs+=`<div class="wk-dc" style="height:${colH}px">${lines}${blocks}</div>`;
  }
  const s=days[0],e=days[6];
  const lbl=`${MONTHS_S[s.getMonth()]} ${s.getDate()} – ${MONTHS_S[e.getMonth()]} ${e.getDate()}, ${e.getFullYear()}`;
  return `<div>
    <div class="nav-row" style="justify-content:center;margin-bottom:10px;">
      <button class="nb" onclick="prevWk()">‹</button>
      <span class="nlbl">${lbl}</span>
      <button class="nb" onclick="nextWk()">›</button>
    </div>
    <div class="wk-wrap">
      <div class="wk-hdr">${hdr}</div>
      <div class="wk-ad">${ad}</div>
      <div class="wk-body">${tc}${dcs}</div>
    </div>
  </div>`;
}

// ── DAY VIEW ──────────────────────────────────
function renderDay(){
  const dd=state.dayDate;
  const y=dd.getFullYear(),m=dd.getMonth(),d=dd.getDate();
  const dw=(dd.getDay()+6)%7;
  const key=dk(y,m,d);
  const cc=customDays[key];
  const evts=getEvts(y,m,d);
  const oneoff=evts.filter(e=>!e.rec);
  const rec=evts.filter(e=>e.rec);
  const hst=cc?` style="background:${cc};color:${contrast(cc)}"`:''
  const isTd=isT(y,m,d);
  let evtHtml='';
  if(oneoff.length){
    evtHtml+=`<div class="dv-sec">Events</div>`;
    evtHtml+=oneoff.map(e=>`<div class="dv-row"><span class="dv-time">all-day</span><span>${e.label}</span></div>`).join('');
  }
  if(rec.length){
    evtHtml+=`<div class="dv-sec">Schedule</div>`;
    evtHtml+=rec.map(e=>`<div class="dv-row rec"><span class="dv-time">${ft(e.h,e.m)}</span><span>${e.label}</span></div>`).join('');
  }
  if(!evts.length)evtHtml='<div class="no-ev">No events for this day.</div>';
  return `<div class="dv-wrap">
    <div class="nav-row" style="justify-content:center;margin-bottom:10px;">
      <button class="nb" onclick="prevDay()">‹</button>
      <span class="nlbl">${DAYS_F[dw]}, ${MONTHS[m]} ${d}</span>
      <button class="nb" onclick="nextDay()">›</button>
    </div>
    <div class="dv-hdr"${hst}>
      <div>
        <div class="dv-title">${MONTHS[m]} ${d}, ${y}${isTd?' <span style="font-size:.7rem;opacity:.7">(Today)</span>':''}</div>
        <div class="dv-sub">${DAYS_F[dw]}</div>
      </div>
      <button class="dv-cbtn" onclick="openDcp(event,'${key}','${MONTHS_S[m]} ${d}')">🎨 Color</button>
    </div>
    <div class="dv-evts">${evtHtml}</div>
  </div>`;
}

// ── FILTER BAR ────────────────────────────────
function renderFbar(){
  return Object.entries(FILTERS).map(([k,f])=>
    `<div class="ftag${f.on?' on':''}" onclick="toggleF('${k}')">${f.label}</div>`
  ).join('');
}

// ── MAIN RENDER ───────────────────────────────
function render(){
  const sd=new Date(LAST_SYNCED+'T12:00:00');
  const sl=`${MONTHS_S[sd.getMonth()]} ${sd.getDate()}, ${sd.getFullYear()}`;
  let yearNav='';
  if(state.view==='yearly'){
    yearNav=`<div class="nav-row">
      <button class="nb" onclick="changeYear(-1)">‹</button>
      <span style="font-size:1.1rem;font-weight:700;min-width:54px;text-align:center;">${state.year}</span>
      <button class="nb" onclick="changeYear(1)">›</button>
    </div>`;
  }
  let main='';
  if(state.view==='yearly')main=renderYear();
  else if(state.view==='monthly')main=renderMonth();
  else if(state.view==='weekly')main=renderWeek();
  else main=renderDay();
  document.getElementById('app').innerHTML=`
    <div class="hdr">
      <div class="hdr-l">
        <div class="title">🌍 My Calendar</div>
        <button class="sync-btn" onclick="syncCal()">🔄 Sync</button>
        <span class="sync-ts">Synced ${sl}</span>
      </div>
      <div class="hdr-r">
        ${yearNav}
        <div class="vbtns">
          <button class="vb${state.view==='yearly'?' active':''}" onclick="setV('yearly')">Year</button>
          <button class="vb${state.view==='monthly'?' active':''}" onclick="setV('monthly')">Month</button>
          <button class="vb${state.view==='weekly'?' active':''}" onclick="setV('weekly')">Week</button>
          <button class="vb${state.view==='daily'?' active':''}" onclick="setV('daily')">Day</button>
        </div>
      </div>
    </div>
    <div class="fbar">${renderFbar()}</div>
    ${main}`;
}

// ── ACTIONS ───────────────────────────────────
function setV(v){state.view=v;render();}
function changeYear(n){state.year+=n;render();}
function prevM(){if(--state.month<0){state.month=11;state.year--;}render();}
function nextM(){if(++state.month>11){state.month=0;state.year++;}render();}
function prevWk(){state.weekMon=addD(state.weekMon,-7);render();}
function nextWk(){state.weekMon=addD(state.weekMon,7);render();}
function prevDay(){state.dayDate=addD(state.dayDate,-1);render();}
function nextDay(){state.dayDate=addD(state.dayDate,1);render();}
function goMonth(y,m){state.view='monthly';state.year=y;state.month=m;render();}
function goDay(y,m,d){state.view='daily';state.dayDate=new Date(y,m,d);render();}
function toggleF(k){FILTERS[k].on=!FILTERS[k].on;render();}

// ── DCP ───────────────────────────────────────
function openDcp(e,key,lbl){
  e.stopPropagation();
  dcpKey=key;
  document.getElementById('dcp-lbl').textContent=lbl;
  const cc=customDays[key]||'#3949ab';
  document.getElementById('dcp-picker').value=cc;
  document.getElementById('dcp-prev-el').style.background=cc;
  const pop=document.getElementById('dcp-pop');
  pop.style.top=Math.min(e.clientY+10,window.innerHeight-160)+'px';
  pop.style.left=Math.min(e.clientX+10,window.innerWidth-240)+'px';
  pop.style.display='block';
  document.getElementById('dcp-ov').style.display='block';
}
function closeDcp(){document.getElementById('dcp-pop').style.display='none';document.getElementById('dcp-ov').style.display='none';dcpKey=null;}
function applyDcp(){if(!dcpKey)return;customDays[dcpKey]=document.getElementById('dcp-picker').value;saveCD();closeDcp();render();}
function clearDcp(){if(!dcpKey)return;delete customDays[dcpKey];saveCD();closeDcp();render();}

// ── SYNC ──────────────────────────────────────
function syncCal(){
  const p='Sync my country calendar from Fantastical and update country-calendar.html';
  if(navigator.clipboard)navigator.clipboard.writeText(p).then(()=>showToast('📋 Prompt copied!'));
  setTimeout(()=>location.reload(),1500);
}
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}

render();
</script>
</body>
</html>
