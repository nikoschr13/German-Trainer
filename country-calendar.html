<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌍 My Calendar</title>
  <style>
    :root {
      --CH:#e53e3e; --CY:#d4a017; --SUI:#cc0000; --GER:#444444;
      --AEK:#c9a000; --ANO:#003087; --RU:#b22222;
      --TRAVEL:#0891b2; --BDAY:#db2777; --PERSONAL:#0d9488;
      --WORK:#d97706; --FAMILY:#16a34a;
      --bg:#0f1117; --card:#1c1f2e; --card2:#252940;
      --border:#2a2d3e; --text:#e8eaf6; --muted:#7986cb;
      --weekend:#5c6bc0; --today-ring:#3949ab;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;padding:16px;}

    .header{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
    .header-left{display:flex;align-items:center;gap:12px;}
    .title{font-size:1.2rem;font-weight:700;}
    .sync-wrap{display:flex;align-items:center;gap:6px;}
    .sync-btn{background:var(--card);border:1px solid var(--border);color:var(--muted);cursor:pointer;padding:4px 9px;border-radius:6px;font-size:.7rem;display:flex;align-items:center;gap:4px;white-space:nowrap;transition:all .15s;}
    .sync-btn:hover{background:var(--card2);color:var(--text);}
    .sync-ts{font-size:.6rem;color:var(--muted);white-space:nowrap;}
    .header-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
    .year-nav{display:flex;align-items:center;gap:6px;}
    .nav-btn{background:var(--card);border:1px solid var(--border);color:var(--text);cursor:pointer;width:28px;height:28px;border-radius:6px;font-size:1rem;display:flex;align-items:center;justify-content:center;}
    .nav-btn:hover{background:var(--card2);}
    .year-label{font-size:1.15rem;font-weight:700;min-width:50px;text-align:center;}
    .view-btns{display:flex;background:var(--card);border:1px solid var(--border);border-radius:6px;overflow:hidden;}
    .view-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:5px 14px;font-size:0.8rem;font-weight:600;}
    .view-btn.active{background:var(--card2);color:var(--text);}

    /* Legend */
    .legend-wrap{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px 14px;margin-bottom:10px;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;}
    .leg{display:flex;align-items:center;gap:5px;font-size:0.7rem;cursor:pointer;user-select:none;white-space:nowrap;padding:2px 0;}
    .leg.off .leg-label{opacity:0.3;text-decoration:line-through;}
    .leg-swatch{position:relative;width:13px;height:13px;border-radius:3px;flex-shrink:0;border:1px solid rgba(255,255,255,.12);}
    .leg-swatch input[type=color]{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer;border:none;padding:0;}
    .leg-label{color:var(--text);}
    .leg-sep{width:1px;height:18px;background:var(--border);margin:0 4px;}

    /* Year view */
    .yearly-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;}
    .mini-card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:8px;}
    .mini-title{font-size:0.75rem;font-weight:700;text-align:center;margin-bottom:5px;text-transform:uppercase;letter-spacing:.4px;}
    .mini-header{display:grid;grid-template-columns:repeat(7,1fr);margin-bottom:2px;}
    .mini-header span{text-align:center;font-size:0.58rem;color:var(--muted);font-weight:600;}
    .mini-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;}
    .mc{text-align:center;font-size:0.65rem;padding:2px 0 0;border-radius:2px;cursor:pointer;position:relative;line-height:1.1;min-height:22px;transition:filter .1s;}
    .mc:hover{filter:brightness(1.25);}
    .mc.weekend{color:var(--weekend);}
    .mc.ch-h{background:var(--CH);color:#fff;}
    .mc.cy-h{background:var(--CY);color:#111;}
    .mc.both-h{background:linear-gradient(135deg,var(--CH) 50%,var(--CY) 50%);color:#fff;}
    .mc.is-today{outline:2px solid var(--today-ring);outline-offset:-1px;font-weight:700;border-radius:50%;}
    .mc[data-tip]:hover::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 4px);left:50%;transform:translateX(-50%);background:#111827;color:#f3f4f6;font-size:0.6rem;white-space:pre-wrap;padding:4px 8px;border-radius:5px;z-index:200;border:1px solid var(--border);pointer-events:none;max-width:200px;text-align:left;line-height:1.4;}
    .mc-dots{display:flex;gap:1px;justify-content:center;flex-wrap:wrap;padding-bottom:1px;}
    .mdot{width:4px;height:4px;border-radius:50%;flex-shrink:0;}
    .mc-cbar{position:absolute;bottom:0;left:0;right:0;height:3px;border-radius:0 0 2px 2px;}

    /* Month view */
    .monthly-wrap{display:grid;grid-template-columns:1fr 240px;gap:12px;}
    @media(max-width:800px){.monthly-wrap{grid-template-columns:1fr;}}
    .month-nav{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;}
    .month-label{font-size:1.1rem;font-weight:700;min-width:180px;text-align:center;}
    .big-card{background:var(--card);border:1px solid var(--border);border-radius:8px;overflow:hidden;}
    .big-hdr{display:grid;grid-template-columns:repeat(7,1fr);background:var(--card2);}
    .big-hdr span{text-align:center;padding:6px 2px;font-size:0.7rem;font-weight:600;color:var(--muted);}
    .big-grid{display:grid;grid-template-columns:repeat(7,1fr);}
    .bd{min-height:80px;padding:4px 5px;border-top:1px solid var(--border);border-right:1px solid var(--border);position:relative;overflow:hidden;}
    .bd.empty{background:rgba(0,0,0,.2);}
    .bd.ch-h{background:var(--CH);}
    .bd.cy-h{background:var(--CY);}
    .bd.both-h{background:linear-gradient(135deg,var(--CH) 50%,var(--CY) 50%);}
    .bd.ch-h .dn,.bd.both-h .dn{color:rgba(255,255,255,.9);}
    .bd.cy-h .dn{color:rgba(0,0,0,.75);}
    .bd.weekend:not(.ch-h):not(.cy-h):not(.both-h) .dn{color:var(--weekend);}
    .dn{font-size:.78rem;font-weight:600;margin-bottom:2px;display:inline-block;cursor:pointer;border-radius:3px;padding:0 2px;transition:background .12s;}
    .dn:hover{background:rgba(255,255,255,.18);}
    .dn-hint{font-size:.45rem;vertical-align:super;margin-left:1px;opacity:.7;}
    .bd.is-today .dn{background:white;color:var(--bg)!important;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.7rem;}
    .hname{font-size:.58rem;line-height:1.25;display:block;margin-top:1px;opacity:.9;overflow:hidden;max-width:100%;white-space:nowrap;text-overflow:ellipsis;}
    .bd.ch-h .hname,.bd.both-h .hname{color:rgba(255,255,255,.9);}
    .bd.cy-h .hname{color:rgba(0,0,0,.7);}
    .etags{display:flex;flex-direction:column;gap:1px;margin-top:2px;}
    .etag{font-size:.55rem;font-weight:700;padding:1px 3px;border-radius:2px;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.4;cursor:default;display:block;}
    .etag.SUI{background:var(--SUI);}
    .etag.GER{background:var(--GER);}
    .etag.AEK{background:var(--AEK);color:#000;}
    .etag.ANO{background:var(--ANO);}
    .etag.RU{background:var(--RU);}
    .etag.TRAVEL{background:var(--TRAVEL);}
    .etag.BDAY{background:var(--BDAY);}
    .etag.PERSONAL{background:var(--PERSONAL);}
    .etag.WORK{background:var(--WORK);}
    .etag.FAMILY{background:var(--FAMILY);}
    .bd-cstripe{position:absolute;top:0;right:0;bottom:0;width:5px;border-radius:0 0 0 0;}

    /* Sidebar */
    .sidebar{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;height:fit-content;max-height:85vh;overflow-y:auto;}
    .sb-title{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:8px;}
    .h-row{display:flex;align-items:flex-start;gap:6px;padding:4px 0;border-bottom:1px solid var(--border);font-size:.72rem;}
    .h-row:last-child{border-bottom:none;}
    .h-dot{width:6px;height:6px;border-radius:50%;margin-top:3px;flex-shrink:0;}
    .h-date{color:var(--muted);min-width:38px;font-size:.68rem;}
    .no-h{font-size:.72rem;color:var(--muted);padding:5px 0;}

    /* Day Color Popup */
    .dcp-overlay{position:fixed;inset:0;z-index:498;background:rgba(0,0,0,.35);display:none;}
    .dcp-popup{position:fixed;z-index:499;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;min-width:210px;box-shadow:0 10px 40px rgba(0,0,0,.6);display:none;}
    .dcp-title{font-size:.78rem;font-weight:700;margin-bottom:12px;color:var(--text);}
    .dcp-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
    .dcp-row label{font-size:.7rem;color:var(--muted);}
    #dcp-picker{width:44px;height:30px;border:1px solid var(--border);border-radius:5px;cursor:pointer;background:none;padding:2px;}
    .dcp-preview{width:22px;height:22px;border-radius:4px;border:1px solid var(--border);display:inline-block;flex-shrink:0;}
    .dcp-btns{display:flex;gap:6px;}
    .dcp-btns button{background:var(--card2);border:1px solid var(--border);color:var(--text);cursor:pointer;padding:5px 11px;border-radius:6px;font-size:.7rem;transition:background .12s;}
    .dcp-btns button:hover{background:var(--border);}
    .dcp-apply{background:#1e3a5f!important;border-color:#2563eb!important;color:#93c5fd!important;}
    .dcp-apply:hover{background:#1e40af!important;}
    .dcp-clear{color:#f87171!important;}

    /* Sync toast */
    .sync-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e3a5f;border:1px solid #2563eb;color:#93c5fd;padding:8px 18px;border-radius:8px;font-size:.75rem;z-index:600;opacity:0;transition:opacity .3s;pointer-events:none;}
    .sync-toast.show{opacity:1;}
  </style>
</head>
<body>
<div id="app"></div>

<!-- Day Color Popup -->
<div class="dcp-overlay" id="dcp-overlay" onclick="closeDcp()"></div>
<div class="dcp-popup" id="dcp-popup">
  <div class="dcp-title">🎨 Color for <span id="dcp-label" style="font-weight:400;opacity:.8;"></span></div>
  <div class="dcp-row">
    <label>Color:</label>
    <input type="color" id="dcp-picker" value="#3949ab" oninput="document.getElementById('dcp-preview').style.background=this.value">
    <span class="dcp-preview" id="dcp-preview" style="background:#3949ab;"></span>
  </div>
  <div class="dcp-btns">
    <button class="dcp-apply" onclick="applyDayColor()">✓ Apply</button>
    <button class="dcp-clear" onclick="clearDayColor()">✕ Clear</button>
    <button onclick="closeDcp()">Cancel</button>
  </div>
</div>

<!-- Sync Toast -->
<div class="sync-toast" id="sync-toast"></div>

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const MONTHS_S = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const DAYS_S = ["Mo","Tu","We","Th","Fr","Sa","Su"];

let state = {view:'yearly', year:new Date().getFullYear(), month:new Date().getMonth()};
const today = new Date();

// Load or init colors (persisted)
const colors = Object.fromEntries(Object.entries(CAT).map(([k,v])=>[k,v.color]));
try { const sc=localStorage.getItem('cal_colors'); if(sc) Object.assign(colors,JSON.parse(sc)); } catch(e){}

const visible = Object.fromEntries(Object.keys(CAT).map(k=>[k,true]));

// Custom per-day colors: key = "year-month0-day", value = "#hex"
let customDays = {};
try { const cd=localStorage.getItem('cal_custom_days'); if(cd) customDays=JSON.parse(cd); } catch(e){}

// Day color popup state
let dcpKey = null;

// ─── Persistence helpers ────────────────────────────────
function saveColors(){ try{localStorage.setItem('cal_colors',JSON.stringify(colors));}catch(e){} }
function saveCustomDays(){ try{localStorage.setItem('cal_custom_days',JSON.stringify(customDays));}catch(e){} }

function updateCSSVars(){
  for(const [k,v] of Object.entries(CAT))
    document.documentElement.style.setProperty(v.cssVar, colors[k]);
}

// ═══════════════════════════════════════════════════════
//  LOOKUP BUILDER
// ═══════════════════════════════════════════════════════
function buildLookup(year){
  const map={};
  for(const [cat, ydata] of Object.entries(H)){
    if(!visible[cat]) continue;
    for(const [m,d,name] of (ydata[year]||[])){
      const k=`${m}-${d}`;
      if(!map[k]) map[k]=[];
      map[k].push({cat,name});
    }
  }
  return map;
}

function firstDow(y,m){return(new Date(y,m,1).getDay()+6)%7;}
function daysIn(y,m){return new Date(y,m+1,0).getDate();}

function bgClass(items){
  if(!items?.length) return '';
  const bg=items.filter(i=>CAT[i.cat].bg).map(i=>i.cat);
  if(!bg.length) return '';
  if(bg.includes('CH')&&bg.includes('CY')) return 'both-h';
  if(bg.includes('CH')) return 'ch-h';
  return 'cy-h';
}

function tipText(items){
  return items.map(i=>i.name).join('\n');
}

// ═══════════════════════════════════════════════════════
//  YEAR VIEW
// ═══════════════════════════════════════════════════════
function miniMonth(y,m){
  const lk=buildLookup(y);
  const fd=firstDow(y,m), days=daysIn(y,m);
  let cells='';
  for(let i=0;i<fd;i++) cells+=`<div class="mc"></div>`;
  for(let d=1;d<=days;d++){
    const dayKey=`${y}-${m}-${d}`;
    const items=lk[`${m}-${d}`]||[];
    const hc=bgClass(items);
    const dow=(fd+d-1)%7;
    const wk=(!hc&&dow>=5)?'weekend':'';
    const isT=y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();
    const dotItems=items.filter(i=>!CAT[i.cat].bg);
    const dots=dotItems.slice(0,6).map(i=>`<span class="mdot" style="background:${colors[i.cat]}"></span>`).join('');
    const tip=items.length?` data-tip="${tipText(items).replace(/"/g,'&quot;')}"` :'';
    const customColor=customDays[dayKey];
    const cbar=customColor?`<div class="mc-cbar" style="background:${customColor}"></div>`:'';
    cells+=`<div class="mc ${hc} ${wk} ${isT?'is-today':''}"${tip} onclick="openDcp(event,'${dayKey}','${MONTHS_S[m]} ${d}')">${d}${dots?`<div class="mc-dots">${dots}</div>`:''}${cbar}</div>`;
  }
  return `<div class="mini-card">
    <div class="mini-title">${MONTHS[m]}</div>
    <div class="mini-header">${DAYS_S.map(d=>`<span>${d}</span>`).join('')}</div>
    <div class="mini-grid">${cells}</div>
  </div>`;
}

function renderYearly(){
  let h='<div class="yearly-grid">';
  for(let m=0;m<12;m++) h+=miniMonth(state.year,m);
  return h+'</div>';
}

// ═══════════════════════════════════════════════════════
//  MONTH VIEW
// ═══════════════════════════════════════════════════════
function renderMonthly(){
  const {year:y,month:m}=state;
  const lk=buildLookup(y);
  const fd=firstDow(y,m), days=daysIn(y,m);

  let cells='';
  for(let i=0;i<fd;i++) cells+=`<div class="bd empty"></div>`;
  for(let d=1;d<=days;d++){
    const dayKey=`${y}-${m}-${d}`;
    const items=lk[`${m}-${d}`]||[];
    const hc=bgClass(items);
    const dow=(fd+d-1)%7;
    const wk=dow>=5?'weekend':'';
    const isT=y===today.getFullYear()&&m===today.getMonth()&&d===today.getDate();
    const bgNames=items.filter(i=>CAT[i.cat].bg).map(i=>`<span class="hname">${i.name}</span>`).join('');
    const tags=items.filter(i=>!CAT[i.cat].bg).map(i=>`<span class="etag ${i.cat}" title="${i.name}">${i.name}</span>`).join('');
    const customColor=customDays[dayKey];
    const cstripe=customColor?`<div class="bd-cstripe" style="background:${customColor}"></div>`:'';
    const hint=customColor?`<span class="dn-hint" style="color:${customColor}">●</span>`:'';
    cells+=`<div class="bd ${hc} ${wk} ${isT?'is-today':''}">
      ${cstripe}
      <span class="dn" onclick="openDcp(event,'${dayKey}','${MONTHS_S[m]} ${d}')">${d}${hint}</span>
      ${bgNames}
      ${tags?`<div class="etags">${tags}</div>`:''}
    </div>`;
  }

  const bigCal=`<div>
    <div class="month-nav">
      <button class="nav-btn" onclick="prevM()">‹</button>
      <span class="month-label">${MONTHS[m]} ${y}</span>
      <button class="nav-btn" onclick="nextM()">›</button>
    </div>
    <div class="big-card">
      <div class="big-hdr">${DAYS_S.map(d=>`<span>${d}</span>`).join('')}</div>
      <div class="big-grid">${cells}</div>
    </div>
  </div>`;

  const allEvts=[];
  for(let d=1;d<=days;d++){
    for(const i of (lk[`${m}-${d}`]||[])) allEvts.push({d,cat:i.cat,name:i.name});
  }
  const sbRows=allEvts.length
    ? allEvts.map(e=>`<div class="h-row"><span class="h-dot" style="background:${colors[e.cat]}"></span><span class="h-date">${MONTHS_S[m]} ${e.d}</span><span>${e.name}</span></div>`).join('')
    : `<div class="no-h">No events</div>`;

  const sidebar=`<div class="sidebar">
    <div class="sb-title">📅 ${MONTHS[m]} ${y}</div>${sbRows}
  </div>`;

  return `<div class="monthly-wrap">${bigCal}${sidebar}</div>`;
}

// ═══════════════════════════════════════════════════════
//  LEGEND
// ═══════════════════════════════════════════════════════
function renderLegend(){
  const keys=Object.keys(CAT);
  return keys.map((k,i)=>{
    const sep=(i===1||i===6||i===9)?'<div class="leg-sep"></div>':'';
    return `${sep}<div class="leg ${visible[k]?'':'off'}" id="leg-${k}" onclick="toggleCat('${k}')">
      <div class="leg-swatch" style="background:${colors[k]}">
        <input type="color" value="${colors[k]}" onclick="event.stopPropagation()" onchange="changeCatColor('${k}',this.value)">
      </div>
      <span class="leg-label">${CAT[k].label}</span>
    </div>`;
  }).join('');
}

// ═══════════════════════════════════════════════════════
//  RENDER
// ═══════════════════════════════════════════════════════
function render(){
  const isYear=state.view==='yearly';
  const syncDate=new Date(LAST_SYNCED+'T12:00:00');
  const syncLabel=`${MONTHS_S[syncDate.getMonth()]} ${syncDate.getDate()}, ${syncDate.getFullYear()}`;
  document.getElementById('app').innerHTML=`
    <div class="header">
      <div class="header-left">
        <div class="title">🌍 My Calendar</div>
        <div class="sync-wrap">
          <button class="sync-btn" id="sync-btn" onclick="syncCalendar()">🔄 Sync</button>
          <span class="sync-ts">Synced ${syncLabel}</span>
        </div>
      </div>
      <div class="header-right">
        <div class="year-nav">
          <button class="nav-btn" onclick="changeYear(-1)">‹</button>
          <span class="year-label">${state.year}</span>
          <button class="nav-btn" onclick="changeYear(1)">›</button>
        </div>
        <div class="view-btns">
          <button class="view-btn ${isYear?'active':''}" onclick="setView('yearly')">Year</button>
          <button class="view-btn ${!isYear?'active':''}" onclick="setView('monthly')">Month</button>
        </div>
      </div>
    </div>
    <div class="legend-wrap">${renderLegend()}</div>
    <div>${isYear?renderYearly():renderMonthly()}</div>
  `;
}

// ═══════════════════════════════════════════════════════
//  ACTIONS
// ═══════════════════════════════════════════════════════
function changeYear(d){state.year+=d;render();}
function setView(v){state.view=v;render();}
function prevM(){if(--state.month<0){state.month=11;state.year--;}render();}
function nextM(){if(++state.month>11){state.month=0;state.year++;}render();}
function toggleCat(k){visible[k]=!visible[k];render();}
function changeCatColor(k,v){colors[k]=v;saveColors();updateCSSVars();render();}

// ─── Sync ────────────────────────────────────────────────
function syncCalendar(){
  const prompt='Sync my country calendar from Fantastical and update country-calendar.html';
  if(navigator.clipboard){
    navigator.clipboard.writeText(prompt).then(()=>{
      showToast('📋 Sync prompt copied! Paste it to Claude, then click Sync again to reload.');
      const btn=document.getElementById('sync-btn');
      if(btn){btn.textContent='✅ Copied!';setTimeout(()=>{btn.innerHTML='🔄 Sync';},2000);}
    }).catch(()=>fallbackSync(prompt));
  } else { fallbackSync(prompt); }
}
function fallbackSync(prompt){
  // fallback: show prompt in a toast with instructions
  showToast('Ask Claude: "'+prompt+'" — then reload this page.');
}
function showToast(msg){
  const t=document.getElementById('sync-toast');
  t.textContent=msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),4000);
}

// ─── Day Color Popup ─────────────────────────────────────
function openDcp(e, key, label){
  e.stopPropagation();
  dcpKey=key;
  document.getElementById('dcp-label').textContent=label;
  const existing=customDays[key]||'#3949ab';
  const picker=document.getElementById('dcp-picker');
  picker.value=existing;
  document.getElementById('dcp-preview').style.background=existing;
  const popup=document.getElementById('dcp-popup');
  const overlay=document.getElementById('dcp-overlay');
  popup.style.display='block';
  overlay.style.display='block';
  // Position near click, keep in viewport
  const pw=210, ph=120;
  let x=e.clientX+8, y=e.clientY+8;
  if(x+pw>window.innerWidth-8) x=e.clientX-pw-8;
  if(y+ph>window.innerHeight-8) y=e.clientY-ph-8;
  popup.style.left=Math.max(8,x)+'px';
  popup.style.top=Math.max(8,y)+'px';
}

function applyDayColor(){
  if(!dcpKey) return;
  customDays[dcpKey]=document.getElementById('dcp-picker').value;
  saveCustomDays();
  closeDcp();
  render();
}

function clearDayColor(){
  if(!dcpKey) return;
  delete customDays[dcpKey];
  saveCustomDays();
  closeDcp();
  render();
}

function closeDcp(){
  document.getElementById('dcp-popup').style.display='none';
  document.getElementById('dcp-overlay').style.display='none';
  dcpKey=null;
}

// ─── Init ─────────────────────────────────────────────────
updateCSSVars();
render();
</script>
